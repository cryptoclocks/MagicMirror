<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AURA · AI Studio</title><link rel="stylesheet" href="style.css">
<main><section class="stage"><video id="output" autoplay playsinline muted></video><canvas id="local-output" hidden></canvas><canvas id="ai-photo" hidden></canvas><canvas id="ai-mask" hidden></canvas><video id="input" autoplay playsinline muted></video><div id="empty"><span>LIVE IMAGINATION</span><h1>เปลี่ยนกระจกเป็นโลกของคุณ</h1><p>เลือกสไตล์ หรือบอกว่าอยากเห็นอะไร</p></div><div class="pill" id="status" role="status">พร้อมสร้างสรรค์</div><span id="timer"></span></section>
<section class="controls"><div id="presets"><button data-style="anime">อนิเมะ</button><button data-style="cyberpunk">ไซเบอร์พังก์</button><button data-style="hologram">โฮโลแกรม</button><button data-style="watercolor">สีน้ำ</button></div>
<div class="mode-row"><select id="provider" aria-label="Processing"><option value="local" selected>Local GPU</option><option value="generative">Local AI · Metal</option><option value="cloud">Lucy 2.5 Cloud</option></select><span id="mode-info">Local GPU · no API key</span></div><section id="ai-controls" hidden><div class="actions"><select id="ai-region"><option value="hat">หมวก</option><option value="clothes">เสื้อผ้า</option><option value="face">ใบหน้า</option><option value="background">ฉากหลัง</option></select><button id="ai-freeze">ถ่ายใหม่</button><button id="ai-clear">ล้างพื้นที่</button><label>ขนาดแปรง <input id="ai-brush" type="range" min="5" max="60" value="25"></label><label><input type="checkbox" id="ai-erase">ลบพื้นที่</label></div><div class="actions"><input id="ai-prompt" maxlength="1000" placeholder="Describe the edit in English"><select id="ai-steps"><option value="4">เร็ว · 4 ขั้น</option><option value="8">ละเอียด · 8 ขั้น</option></select><button id="ai-generate">สร้างภาพ</button><label><input type="checkbox" id="ai-continuous">สร้างต่อเนื่อง + ภาพหน่วง</label></div></section><form id="prompt-form"><input id="prompt" maxlength="1000" aria-label="คำอธิบายเอฟเฟกต์" placeholder="เช่น เปลี่ยนชุดเป็นนักบินอวกาศ ฉากหลังสถานีอวกาศ"><button id="apply" type="submit" disabled>เปลี่ยนเอฟเฟกต์</button></form>
<div class="actions"><select id="camera" aria-label="เลือกกล้อง"><option value="">กล้องเริ่มต้น</option></select><button id="preview">ดูกล้องในเครื่อง</button><button id="start" disabled>เริ่ม AI · ส่งภาพไป Decart</button><button id="stop" disabled>หยุด</button></div><p id="hint">กำลังตรวจการตั้งค่า…</p><small id="privacy">วิดีโอเท่านั้น · ไม่ส่งไมโครโฟน · ใช้เครดิต Decart · หยุดอัตโนมัติใน 2 นาที</small></section></main><script src="studio.bundle.js"></script></html>
